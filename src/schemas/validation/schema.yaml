$id: 'https://spec.openapis.org/security/legacy/3.3/schema/WORK-IN-PROGRESS'
$schema: 'https://json-schema.org/draft/2020-12/schema'

description: The description of OpenAPI legacy security Objects

$defs:
  security-scheme:
    $comment: https://spec.openapis.org/oas/v3.3#security-scheme-object
    type: object
    properties:
      type:
        enum:
          - apiKey
          - http
          - mutualTLS
          - oauth2
          - openIdConnect
      description:
        type: string
      deprecated:
        default: false
        type: boolean
    required:
      - type
    allOf:
      - $ref: '#/$defs/specification-extensions'
      - $ref: '#/$defs/security-scheme/$defs/type-apikey'
      - $ref: '#/$defs/security-scheme/$defs/type-http'
      - $ref: '#/$defs/security-scheme/$defs/type-http-bearer'
      - $ref: '#/$defs/security-scheme/$defs/type-oauth2'
      - $ref: '#/$defs/security-scheme/$defs/type-oidc'
    unevaluatedProperties: false

    $defs:
      type-apikey:
        if:
          properties:
            type:
              const: apiKey
        then:
          properties:
            name:
              type: string
            in:
              enum:
                - query
                - header
                - cookie
          required:
            - name
            - in

      type-http:
        if:
          properties:
            type:
              const: http
        then:
          properties:
            scheme:
              type: string
          required:
            - scheme

      type-http-bearer:
        if:
          properties:
            type:
              const: http
            scheme:
              type: string
              pattern: ^[Bb][Ee][Aa][Rr][Ee][Rr]$
          required:
            - type
            - scheme
        then:
          properties:
            bearerFormat:
              type: string

      type-oauth2:
        if:
          properties:
            type:
              const: oauth2
        then:
          properties:
            flows:
              $ref: '#/$defs/oauth-flows'
            oauth2MetadataUrl:
              type: string
              format: uri-reference
          required:
            - flows

      type-oidc:
        if:
          properties:
            type:
              const: openIdConnect
        then:
          properties:
            openIdConnectUrl:
              type: string
              format: uri-reference
          required:
            - openIdConnectUrl

  oauth-flows:
    type: object
    properties:
      implicit:
        $ref: '#/$defs/oauth-flows/$defs/implicit'
      password:
        $ref: '#/$defs/oauth-flows/$defs/password'
      clientCredentials:
        $ref: '#/$defs/oauth-flows/$defs/client-credentials'
      authorizationCode:
        $ref: '#/$defs/oauth-flows/$defs/authorization-code'
      deviceAuthorization:
        $ref: '#/$defs/oauth-flows/$defs/device-authorization'
    $ref: '#/$defs/specification-extensions'
    unevaluatedProperties: false

    $defs:
      implicit:
        type: object
        properties:
          authorizationUrl:
            type: string
            format: uri-reference
          refreshUrl:
            type: string
            format: uri-reference
          scopes:
            $ref: '#/$defs/map-of-strings'
        required:
          - authorizationUrl
          - scopes
        $ref: '#/$defs/specification-extensions'
        unevaluatedProperties: false

      password:
        type: object
        properties:
          tokenUrl:
            type: string
            format: uri-reference
          refreshUrl:
            type: string
            format: uri-reference
          scopes:
            $ref: '#/$defs/map-of-strings'
        required:
          - tokenUrl
          - scopes
        $ref: '#/$defs/specification-extensions'
        unevaluatedProperties: false

      client-credentials:
        type: object
        properties:
          tokenUrl:
            type: string
            format: uri-reference
          refreshUrl:
            type: string
            format: uri-reference
          scopes:
            $ref: '#/$defs/map-of-strings'
        required:
          - tokenUrl
          - scopes
        $ref: '#/$defs/specification-extensions'
        unevaluatedProperties: false

      authorization-code:
        type: object
        properties:
          authorizationUrl:
            type: string
            format: uri-reference
          tokenUrl:
            type: string
            format: uri-reference
          refreshUrl:
            type: string
            format: uri-reference
          scopes:
            $ref: '#/$defs/map-of-strings'
        required:
          - authorizationUrl
          - tokenUrl
          - scopes
        $ref: '#/$defs/specification-extensions'
        unevaluatedProperties: false

      device-authorization:
        type: object
        properties:
          deviceAuthorizationUrl:
            type: string
            format: uri-reference
          tokenUrl:
            type: string
            format: uri-reference
          refreshUrl:
            type: string
            format: uri-reference
          scopes:
            $ref: '#/$defs/map-of-strings'
        required:
          - deviceAuthorizationUrl
          - tokenUrl
          - scopes
        $ref: '#/$defs/specification-extensions'
        unevaluatedProperties: false

  specification-extensions:
    $comment: https://spec.openapis.org/oas/v3.3#specification-extensions
    patternProperties:
      '^x-': true

        additionalProperties:
          $ref: '#/$defs/example-or-reference'

  map-of-strings:
    type: object
    additionalProperties:
      type: string
